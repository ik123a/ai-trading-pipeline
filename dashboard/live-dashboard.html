<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Trading Dashboard</title>
  <style>
    body {font-family: Arial, sans-serif; margin:20px;}
    table {border-collapse: collapse; width: 100%;}
    th, td {border: 1px solid #ddd; padding: 8px; text-align: left;}
    th {background-color: #f2f2f2;}
  </style>
</head>
<body>
  <h1>Live Loss‑Prevention Log</h1>
  <table id="log-table">
    <thead>
      <tr><th>Timestamp</th><th>Equity</th><th>Cash</th><th>Exposure</th><th>Decisions</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <script>
    async function loadLog() {
      const resp = await fetch('live_log.csv');
      const text = await resp.text();
      const lines = text.trim().split('\n').slice(1); // skip header
      const tbody = document.querySelector('#log-table tbody');
      tbody.innerHTML = '';
      const recent = lines.slice(-10).reverse();
      recent.forEach(line => {
        const parts = line.split(',');
        const decisions = parts.slice(4).join(',');
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${parts[0]}</td><td>${parts[1]}</td><td>${parts[2]}</td><td>${parts[3]}</td><td>${decisions}</td>`;
        tbody.appendChild(tr);
      });
    }
    loadLog();
    setInterval(loadLog, 60000);
  </script>
</body>
</html>
